version: 1
disable_existing_loggers: False

formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(module)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: detailed
    stream: ext://sys.stderr

  syslog:
    class: logging.handlers.SysLogHandler
    level: INFO
    formatter: detailed
    address: "/dev/log"

loggers:
  dwlabbind.bind_conf:
    level: INFO
    handlers: [console, syslog]
    propagate: no

  dwlabbind.cli:
    level: INFO
    handlers: [console, syslog]
    propagate: no

  dwlabbind.runner:
    level: INFO
    handlers: [console, syslog]
    propagate: no

root:
  level: INFO
  handlers: [console, syslog]
